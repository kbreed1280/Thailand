name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test on iPhone Simulator
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for rt,devs in d.items() if 'iOS' in rt for dev in devs if dev['name'].startswith('iPhone')))")
          echo "Using simulator $DEST"
          xcodebuild \
            -project Thailand.xcodeproj \
            -scheme Thailand \
            -configuration Debug \
            -destination "id=$DEST" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild.log | grep -iE "error:|warning:|test case .*(passed|failed)|executed [0-9]+ test|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" | sort -u || true
          grep -q "TEST SUCCEEDED" xcodebuild.log

      - name: Count warnings
        if: always()
        run: |
          echo "Warnings (excluding tool noise):"
          grep -E "warning:" xcodebuild.log | grep -v "appintentsmetadataprocessor" | sort -u || echo "none"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
